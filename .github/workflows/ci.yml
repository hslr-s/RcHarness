name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Match the Swift 6.4 toolchain used to validate the version tags locally.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run checks
        run: scripts/test_all.sh
      - name: Build app bundle
        run: scripts/build_app.sh "$RUNNER_TEMP/RcHarness.app"

  intel-runtime:
    name: Intel runtime acceptance
    # GitHub's x86_64 macOS runner. Keep this separate from the ARM build
    # job so the tests execute natively on Intel instead of under Rosetta.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Show Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version
          swift --version
      # DEBUG-intel-hang: collect the blocked stack before the full suite.
      - name: Diagnose complete Intel test sequence
        run: |
          swift build --build-tests
          scripts/test_all.sh &
          test_pid=$!
          (
            sleep 90
            if kill -0 "$test_pid" 2>/dev/null; then
              for pid in $(pgrep -f '[x]ctest.*RcHarnessPackageTests' || true); do
                sample "$pid" 3 -file "$RUNNER_TEMP/intel-hang-$pid.txt" || true
                cat "$RUNNER_TEMP/intel-hang-$pid.txt" || true
                kill "$pid" || true
              done
              kill "$test_pid" || true
            fi
          ) &
          watchdog_pid=$!
          trap 'kill "$watchdog_pid" 2>/dev/null || true' EXIT
          wait "$test_pid"
      - name: Build and verify Universal app on Intel
        run: |
          scripts/build_app.sh "$RUNNER_TEMP/RcHarness-intel-check.app"
          python3 scripts/verify_universal_app.py "$RUNNER_TEMP/RcHarness-intel-check.app"
          file "$RUNNER_TEMP/RcHarness-intel-check.app/Contents/MacOS/RcHarness"
          file "$RUNNER_TEMP/RcHarness-intel-check.app/Contents/PlugIns/RcHarnessMicrophone.driver/Contents/MacOS/RcHarnessMicrophone"

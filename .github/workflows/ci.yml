name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: xcode-27
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      RC_HARNESS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Select ARM toolchain
        if: matrix.arch == 'arm64'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Show native toolchain
        run: |
          test "$(uname -m)" = "$RC_HARNESS_ARCH"
          xcodebuild -version
          swift --version
      - name: Run native checks
        run: scripts/test_all.sh
      - name: Build and verify architecture-specific app
        run: |
          scripts/build_app.sh "$RUNNER_TEMP/RcHarness.app"
          python3 scripts/app_architecture.py verify "$RUNNER_TEMP/RcHarness.app" "$RC_HARNESS_ARCH"
